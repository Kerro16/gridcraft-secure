name: Build portable Windows zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable && rustc --version
      - name: Prune craft-update from the lockfile and apply patched versions
        shell: pwsh
        run: |
          cargo update --workspace
          if (Select-String -Quiet 'name = "ctutils"' Cargo.lock) { cargo update -p ctutils }
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if (git status --porcelain Cargo.lock) {
            git add Cargo.lock
            git commit -m "Update Cargo.lock (drop craft-update, patched ctutils)"
            git push origin HEAD:main
          }
      - name: Build (static C runtime, no Visual C++ redistributable needed)
        run: cargo build --release -p gridcraft -p gridcraft-cli --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          $out = "gridcraft-portable"
          New-Item -ItemType Directory $out | Out-Null
          $bin = "target/x86_64-pc-windows-msvc/release"
          Copy-Item "$bin/gridcraft.exe", "$bin/gridcraft-cli.exe" $out
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE, ATTRIBUTION.md, SECURITY-CHANGES.md $out
          Compress-Archive -Path $out -DestinationPath gridcraft-portable-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: gridcraft-portable-windows-x64
          path: gridcraft-portable-windows-x64.zip
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER"
          gh release create $tag gridcraft-portable-windows-x64.zip --title "Portable build $env:GITHUB_RUN_NUMBER" --notes "Portable Windows x64 build. Unzip and run gridcraft.exe; no installation or Rust needed. Auto-updater removed."
